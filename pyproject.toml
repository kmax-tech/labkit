[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labkit"
version = "0.45.0"
description = "Shared lab helpers: run index, LLM backend, endpoint lease, resumable batches, protocol and notes checkers"
requires-python = ">=3.12"
# stdlib only, on purpose: a lab helper that drags dependencies in decides the
# environment of every experiment that imports it.
dependencies = []

[project.scripts]
protocol-check = "labkit.protocol_check:cli"
runlog = "labkit.runlog:cli"
scope-sha = "labkit.scope_sha:cli"
intent-check = "labkit.intent_check:cli"
code-check = "labkit.code_check:cli"
protocol-fill = "labkit.protocol_fill:cli"
notes-check = "labkit.notes_check:cli"
preflight = "labkit.preflight:cli"
finalize = "labkit.finalize:cli"
claude-hook = "labkit.claude_hooks:cli"
usability = "labkit.usability:cli"

[tool.setuptools]
packages = ["labkit"]

[tool.setuptools.package-data]
# the protocol template IS the checker's contract — shipping the checker
# without it leaves `protocol-check` with nothing to check against.
labkit = ["*.template", "protocol-field-guide.md"]

[tool.ruff.lint]
# Same pinned scope as the lab repos (a shifting default is a knob nobody set).
select = ["E4", "E7", "E9", "F"]
