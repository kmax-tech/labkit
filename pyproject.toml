[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labkit"
version = "0.103.0"
description = "Shared lab helpers: run index, LLM backend, endpoint lease, resumable batches, protocol and notes checkers"
requires-python = ">=3.12"
# stdlib only, on purpose: a lab helper that drags dependencies in decides the
# environment of every experiment that imports it.
dependencies = []

# Development only, never pulled into an experiment: `pip install -e '.[dev]'`.
# Named so a fresh environment (a cloud session, CI) runs the same suite as
# the local one instead of whichever interpreter happens to carry pytest.
[project.optional-dependencies]
# the coding style's three tools: test, lint, type-check (docs/coding-style.md CODE-008 Run the linter and the type checker);
# viztracer for reading a run as a timeline (`just timeline gates.audit ARGS`; the filter holds only when the
# module FILE is run — with `-m` or a console script `--include_files` keeps nothing, viztracer 1.1.1),
# the step past `labkit-calltree` when the order and duration of calls matter;
# pytest-xdist runs the suite on every core in the pre-commit hook
dev = ["pytest", "pytest-xdist", "ruff", "pyright", "viztracer"]

[project.scripts]
protocol-check = "labkit.checks.protocol_report:cli"
runlog = "labkit.run.runlog_command:cli"
scope-sha = "labkit.formats.scope_sha:cli"
intent-check = "labkit.checks.intent_check:cli"
code-check = "labkit.checks.code_check:cli"
protocol-fill = "labkit.tools.protocol_fill:cli"
notes-check = "labkit.checks.notes_check:cli"
preflight = "labkit.gates.preflight:cli"
finalize = "labkit.gates.finalize:cli"
claude-hook = "labkit.gates.claude_hooks:cli"
codex-hook = "labkit.gates.codex_hooks:cli"
usability = "labkit.probes.usability_command:cli"
labkit-audit = "labkit.gates.audit:cli"
labkit-next = "labkit.tools.next_step:cli"
labkit-adopt = "labkit.tools.adopt:cli"
labkit-hooks = "labkit.gates.install_hooks:cli"
labkit-params = "labkit.tools.params:cli"
labkit-calltree = "labkit.tools.calltree:cli"
labkit-init = "labkit.tools.scaffold:cli"
labkit-check = "labkit.tools.repo_check:cli"
report-check = "labkit.gates.report_check:cli"

[tool.setuptools]
# every package by name: a layer package left out ships as a wheel without its
# code, and an editable install does not show it (tests/test_architecture.py)
packages = [
    "labkit",
    "labkit.formats",
    "labkit.run",
    "labkit.checks",
    "labkit.gates",
    "labkit.tools",
    "labkit.probes",
]

[tool.setuptools.package-data]
# the protocol template IS the checker's contract — shipping the checker
# without it leaves `protocol-check` with nothing to check against.
labkit = ["templates/*.template", "agents/*.agent.md", "docs/standard.md", "docs/rules.tsv", "docs/protocol-field-guide.md"]

[tool.ruff]
# a one-off extraction script kept as the evidence of a usability record —
# frozen as it ran, not maintained code
extend-exclude = ["docs/usability/*.py"]

[tool.ruff.lint]
# Same pinned scope as the lab repos (a shifting default is a knob nobody set).
select = ["E4", "E7", "E9", "F", "ANN0", "ANN2", "D100", "D101", "D102", "D103", "D104", "D419", "C901"]
# ANN: every signature annotated (CODE-007 Type hints and docstrings) — ANN401
# (no `Any`) left out: forwarding `**kw` to a typed function needs it.
# D1xx: every public module, class and function has a docstring — its first
# line is the map a reader searches (CODE-015 Make the code findable by name); the
# rest of pydocstyle is a different docstring style than the house's and stays off.
# C901: a function past complexity 10 is refused; the functions above it on
# 2026-10-08 carry `# noqa: C901 complexity baseline 2026-10-08` at their
# signature — visible debt, grep for it, shrink it.

[tool.ruff.lint.per-file-ignores]
# unittest methods: `def test_…(self)` says what it is; `-> None` on each adds nothing
"tests/*" = ["ANN", "D"]

[tool.pyright]
# strict where the code is new (2026-10-08); widen module by module
strict = ["labkit/formats/answering_run.py", "labkit/formats/runs.py", "labkit/run/llm_specs.py", "labkit/probes/cold_reader.py", "labkit/probes/code_navigation.py", "labkit/probes/protocol_reading.py"]
# the repo's own venv (`python3 -m venv .venv && .venv/bin/pip install -e '.[dev]'`):
# without it the editor resolved `labkit` to an old copy installed in some
# other project's venv and flagged every new name as unknown
venvPath = "."
venv = ".venv"
# tests import their shared fixture module (tests/protocol_fixture.py) by name
extraPaths = ["tests"]
# a wheel build leaves a stale copy of the package in build/ (git-ignored);
# checking it failed the pre-commit on code that no longer exists
exclude = ["build", "**/__pycache__", ".venv"]
